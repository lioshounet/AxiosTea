  <g id="code-box-left" data-pptx-bounds="60 190 560 375">
    <rect x="60" y="194" width="560" height="371" rx="12" fill="#060911" />
    <rect x="60" y="190" width="560" height="371" rx="12" fill="#0F172A" stroke="#D81159" stroke-width="1.5" />
    
    <rect x="60" y="190" width="560" height="36" rx="12" fill="#1E293B" />
    <circle cx="80" cy="208" r="5" fill="#D81159" />
    <circle cx="95" cy="208" r="5" fill="#FFBC42" />
    <circle cx="110" cy="208" r="5" fill="#218380" />
    <text x="340.0" y="213" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">标准 HTTP 响应头样例</text>
    
    <text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="258">
      <tspan><tspan fill="#475569"> 1 </tspan><tspan fill="#64748B">// 现代后端标准 Content-Disposition Header</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="280"><tspan><tspan fill="#475569"> 2 </tspan><tspan fill="#E2E8F0">Content-Disposition: attachment;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="302"><tspan><tspan fill="#475569"> 3 </tspan><tspan fill="#E2E8F0">  filename="fallback.xlsx";</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="324"><tspan><tspan fill="#475569"> 4 </tspan><tspan fill="#E2E8F0">  filename*=utf-8''%E7%94%A8%E6%88%B7...;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="346"><tspan><tspan fill="#475569"> 5 </tspan><tspan fill="#E2E8F0" /></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="368"><tspan><tspan fill="#475569"> 6 </tspan><tspan fill="#64748B">// 包含了两个文件名定义：</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="390"><tspan><tspan fill="#475569"> 7 </tspan><tspan fill="#64748B">// 1. filename: 传统 ASCII 兼容备用名</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="80" y="412"><tspan><tspan fill="#475569"> 8 </tspan><tspan fill="#64748B">// 2. filename*: RFC 5987 标准 UTF-8 编码真名</tspan></tspan>
    </text></g>

  
  <g id="code-box-right" data-pptx-bounds="660 190 560 375">
    <rect x="660" y="194" width="560" height="371" rx="12" fill="#060911" />
    <rect x="660" y="190" width="560" height="371" rx="12" fill="#0F172A" stroke="#218380" stroke-width="1.5" />
    
    <rect x="660" y="190" width="560" height="36" rx="12" fill="#1E293B" />
    <circle cx="680" cy="208" r="5" fill="#D81159" />
    <circle cx="695" cy="208" r="5" fill="#FFBC42" />
    <circle cx="710" cy="208" r="5" fill="#218380" />
    <text x="940.0" y="213" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">标准解码提取算法源码 (download.ts)</text>
    
    <text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="258">
      <tspan><tspan fill="#475569"> 1 </tspan><tspan fill="#64748B">// client/src/utils/download.ts</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="280"><tspan><tspan fill="#475569"> 2 </tspan><tspan fill="#E2E8F0">export function extractFileName(disp: string): string {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="302"><tspan><tspan fill="#475569"> 3 </tspan><tspan fill="#64748B">  // 1. 优先匹配 RFC 5987 格式</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="324"><tspan><tspan fill="#475569"> 4 </tspan><tspan fill="#E2E8F0">  const rfcReg = /filename\*=utf-8''([^;]+)/i;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="346"><tspan><tspan fill="#475569"> 5 </tspan><tspan fill="#E2E8F0">  const rfcMatch = disp.match(rfcReg);</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="368"><tspan><tspan fill="#475569"> 6 </tspan><tspan fill="#E2E8F0">  if (rfcMatch &amp;&amp; rfcMatch[1]) {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="390"><tspan><tspan fill="#475569"> 7 </tspan><tspan fill="#E2E8F0">    return decodeURIComponent(rfcMatch[1]);</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="412"><tspan><tspan fill="#475569"> 8 </tspan><tspan fill="#E2E8F0">  }</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="434"><tspan><tspan fill="#475569"> 9 </tspan><tspan fill="#64748B">  // 2. 降级匹配普通 filename="..."</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="456"><tspan><tspan fill="#475569">10 </tspan><tspan fill="#E2E8F0">  const reg = /filename="?([^";]+)"?/i;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="478"><tspan><tspan fill="#475569">11 </tspan><tspan fill="#E2E8F0">  const match = disp.match(reg);</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="500"><tspan><tspan fill="#475569">12 </tspan><tspan fill="#E2E8F0">  return match ? decodeURIComponent(match[1]) : 'file';</tspan></tspan>
    </text></g>

  
