      <tspan><tspan fill="#475569"> 1 </tspan><tspan fill="#64748B">// request.ts 响应拦截器</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="280"><tspan><tspan fill="#475569"> 2 </tspan><tspan fill="#E2E8F0">const { code, data, message } = response.data;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="302"><tspan><tspan fill="#475569"> 3 </tspan><tspan fill="#E2E8F0">if (code === 200 || code === 0) {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="324"><tspan><tspan fill="#475569"> 4 </tspan><tspan fill="#E2E8F0">  return data; // 直接返回业务核心实体</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="346"><tspan><tspan fill="#475569"> 5 </tspan><tspan fill="#E2E8F0">}</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="368"><tspan><tspan fill="#475569"> 6 </tspan><tspan fill="#E2E8F0">ElMessage.error(message || '系统业务异常');</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="13" x="680" y="390"><tspan><tspan fill="#475569"> 7 </tspan><tspan fill="#E2E8F0">return Promise.reject(new Error(message));</tspan></tspan>
