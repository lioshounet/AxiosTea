    <text x="940.0" y="213" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">前端控制台抓包链路日志输出 (Pinia Logger)</text>
    <!-- Code Area -->
    <text x="680" y="258" font-size="13" font-family="'Microsoft YaHei', Consolas, monospace">
      <tspan x="680" dy="0"><tspan fill="#475569"> 1 </tspan><tspan fill="#E2E8F0">[Request] GET /api/test/retry-simulation -&gt; 发出</tspan></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 2 </tspan><tspan fill="#E2E8F0">[Response Error] HTTP 503 Service Unavailable</tspan></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 3 </tspan><tspan fill="#E2E8F0">[Retry Manager] 触发第 1 次重试，等待 1000ms...</tspan></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 4 </tspan><tspan fill="#E2E8F0">[Retry Manager] 触发第 2 次重试，等待 2000ms...</tspan></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 5 </tspan><tspan fill="#E2E8F0">[Response Success] HTTP 200 OK -&gt; 业务数据交付完成！</tspan></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 6 </tspan><tspan fill="#E2E8F0" /></tspan><tspan x="680" dy="22"><tspan fill="#475569"> 7 </tspan><tspan fill="#E2E8F0">页面未弹出报错弹窗，全过程自动自愈！</tspan></tspan>
    </text>
