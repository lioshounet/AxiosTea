    <circle cx="80" cy="208" r="5" fill="#D81159" />
    <circle cx="95" cy="208" r="5" fill="#FFBC42" />
    <circle cx="110" cy="208" r="5" fill="#218380" />
    <text x="340.0" y="213" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">后端 Express 模拟 503 接口 (server/index.js)</text>
    <!-- Code Area -->
    <text x="80" y="258" font-size="13" font-family="'Microsoft YaHei', Consolas, monospace">
      <tspan x="80" dy="0"><tspan fill="#475569"> 1 </tspan><tspan fill="#64748B">// server/index.js</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 2 </tspan><tspan fill="#E2E8F0">let failCount = 0;</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 3 </tspan><tspan fill="#E2E8F0">app.get('/api/test/retry-simulation', (req, res) =&gt; {</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 4 </tspan><tspan fill="#E2E8F0">  failCount++;</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 5 </tspan><tspan fill="#64748B">  // 前 2 次故意返回 503 模拟宕机，第 3 次恢复正常</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 6 </tspan><tspan fill="#E2E8F0">  if (failCount &lt;= 2) {</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 7 </tspan><tspan fill="#E2E8F0">    return res.status(503).json({</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 8 </tspan><tspan fill="#E2E8F0">      code: 503,</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569"> 9 </tspan><tspan fill="#E2E8F0">      message: `[503 维护中] 第 ${failCount} 次重试`</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569">10 </tspan><tspan fill="#E2E8F0">    });</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569">11 </tspan><tspan fill="#E2E8F0">  }</tspan></tspan><tspan x="80" dy="22"><tspan fill="#475569">12 </tspan><tspan fill="#E2E8F0">  failCount = 0; // 重置计数</tspan></tspan>
    </text>
  </g>

