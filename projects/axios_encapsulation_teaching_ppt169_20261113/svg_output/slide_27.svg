    <text x="640" y="213" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle">TypeScript 工业级网络切面源码精读 · IDE 控制台视图</text>
    <text x="85" y="260" font-size="14" font-family="'Microsoft YaHei', Consolas, monospace">
      <tspan x="85" dy="0"><tspan fill="#475569"> 1  </tspan><tspan fill="#64748B">// client/src/utils/request.ts 响应拦截器</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 2  </tspan><tspan fill="#E2E8F0">if (response.config.responseType === 'blob') {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 3  </tspan><tspan fill="#64748B">  // 侦测 Content-Type 是否为 JSON（说明后端虽然 HTTP 200，但实际抛出了业务错误）</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 4  </tspan><tspan fill="#E2E8F0">  if (response.data.type === 'application/json') {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 5  </tspan><tspan fill="#E2E8F0">    return new Promise((_, reject) =&gt; {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 6  </tspan><tspan fill="#E2E8F0">      const reader = new FileReader();</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 7  </tspan><tspan fill="#E2E8F0">      reader.onload = () =&gt; {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 8  </tspan><tspan fill="#E2E8F0">        try {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 9  </tspan><tspan fill="#E2E8F0">          const errorResult = JSON.parse(reader.result as string);</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">10  </tspan><tspan fill="#E2E8F0">          ElMessage.error(errorResult.message || '导出失败，服务端异常');</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">11  </tspan><tspan fill="#E2E8F0">          reject(new Error(errorResult.message));</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">12  </tspan><tspan fill="#E2E8F0">        } catch {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">13  </tspan><tspan fill="#E2E8F0">          reject(new Error('解析 Blob 异常错误失败'));</tspan></tspan>
    </text>
