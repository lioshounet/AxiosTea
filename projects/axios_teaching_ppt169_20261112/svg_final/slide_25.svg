<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Microsoft YaHei', Arial">
  <rect id="bg-canvas" width="1280" height="720" fill="#FAF9F5" data-pptx-role="background" />
  <path id="deco-sheet-1" d="M 0,0 L 380,0 C 330,180 460,260 360,440 C 280,580 400,680 300,720 L 0,720 Z" fill="#F1EFE8" opacity="0.6" data-pptx-role="decoration" />
  <path id="deco-sheet-2" d="M 0,0 L 200,0 C 160,200 260,320 170,500 C 120,620 200,680 160,720 L 0,720 Z" fill="#8F2D56" opacity="0.06" data-pptx-role="decoration" />
  
  
  <g id="header-group" data-pptx-bounds="60 42 1160 138">
    <rect x="60" y="42" width="260" height="28" rx="14" fill="#8F2D56" />
    <text x="190" y="61" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">核心要点六 · Blob异常避坑</text>
    <text x="60" y="106" font-size="28" font-weight="bold" fill="#0F172A">大厂高频坑：Blob 导出异常时 JSON 报错文本反解与拦截</text>
    <text x="60" y="146" font-size="16" fill="#6C757D">经典高频面试题：responseType 为 blob 时后端报错如何处理？</text>
  </g>

  
  <g id="compare-card-left" data-pptx-bounds="60 190 560 375">
    <rect x="60" y="194" width="560" height="371" rx="14" fill="#E2DDD5" />
    <rect x="60" y="190" width="560" height="371" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" />
    <rect x="80" y="210" width="520" height="40" rx="8" fill="#EF4444" opacity="0.12" />
    <rect x="80" y="210" width="8" height="40" rx="4" fill="#EF4444" />
    <text x="100" y="236" font-size="18" font-weight="bold" fill="#EF4444">踩坑现场 (原生致命缺陷)</text>
    <line x1="80" y1="265" x2="600" y2="265" stroke="#E2DDD5" stroke-width="1" />
    <text fill="#2B2D42" font-size="14" x="84" y="300">
      <tspan>前端配置了 responseType: 'blob'。</tspan></text><text fill="#2B2D42" font-size="14" x="84" y="324">后端导出失败报 500 返回 JSON: {"code":5005,"message":"数据已被锁</text><text fill="#2B2D42" font-size="14" x="84" y="348">定"}。</text><text fill="#2B2D42" font-size="14" x="84" y="372">【致命后果】Axios 依然把这串 JSON 强制打包为 Blob！若直接保存，</text><text fill="#2B2D42" font-size="14" x="84" y="396"><tspan>用户会下载一个内容是错误文本但后缀为 .xlsx 的损坏文件！</tspan>
    </text></g>

  
  <g id="compare-card-right" data-pptx-bounds="660 190 560 375">
    <rect x="660" y="194" width="560" height="371" rx="14" fill="#E2DDD5" />
    <rect x="660" y="190" width="560" height="371" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <rect x="680" y="210" width="520" height="40" rx="8" fill="#10B981" opacity="0.12" />
    <rect x="680" y="210" width="8" height="40" rx="4" fill="#10B981" />
    <text x="700" y="236" font-size="18" font-weight="bold" fill="#10B981">工业级破解方案 (Blob 侦测反解)</text>
    <line x1="680" y1="265" x2="1200" y2="265" stroke="#E2DDD5" stroke-width="1" />
    <text fill="#2B2D42" font-size="14" x="684" y="300">
      <tspan>响应拦截器检查 data.type === 'application/json' 或 Content-Type 包</tspan></text><text fill="#2B2D42" font-size="14" x="684" y="324">含 json。</text><text fill="#2B2D42" font-size="14" x="684" y="348">【破解实现】通过 await (data as Blob).text() 读取出原始错误字符串，</text><text fill="#2B2D42" font-size="14" x="684" y="372">执行 JSON.parse，弹出真实业务错误提示并 Promise.reject！杜绝脏文</text><text fill="#2B2D42" font-size="14" x="684" y="396"><tspan>件落地。</tspan>
    </text></g>

  
  <g id="summary-banner" data-pptx-bounds="60 580 1160 76">
