      <tspan>有效期长 (如 7天 / 30天)，</tspan></text><text fill="#2B2D42" font-size="14" x="484" y="312">仅用于在 AccessToken 过期后置换新凭证。</text><text fill="#2B2D42" font-size="14" x="484" y="334"><tspan>不参与日常业务请求，暴露面小。</tspan>
    </text></g>
  
  <g id="card-03" data-pptx-bounds="860 190 360 375">
    <rect x="860" y="194" width="360" height="371" rx="14" fill="#E2DDD5" />
