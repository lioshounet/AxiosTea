    </text></g>
  
  <g id="card-02" data-pptx-bounds="460 190 360 375">
    <rect x="460" y="194" width="360" height="371" rx="14" fill="#E2DDD5" />
    <rect x="460" y="190" width="360" height="371" rx="14" fill="#FFFFFF" stroke="#218380" stroke-width="1.5" />
    <rect x="480" y="210" width="32" height="32" rx="8" fill="#218380" />
    <text x="496" y="232" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="520" y="232" font-size="18" font-weight="bold" fill="#218380">Refresh Token (长期凭据)</text>
