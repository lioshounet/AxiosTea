<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Microsoft YaHei', Arial">
  <rect id="bg-canvas" width="1280" height="720" fill="#FAF9F5" data-pptx-role="background" />
  <path id="deco-sheet-1" d="M 0,0 L 380,0 C 330,180 460,260 360,440 C 280,580 400,680 300,720 L 0,720 Z" fill="#F1EFE8" opacity="0.6" data-pptx-role="decoration" />
  <path id="deco-sheet-2" d="M 0,0 L 200,0 C 160,200 260,320 170,500 C 120,620 200,680 160,720 L 0,720 Z" fill="#8F2D56" opacity="0.06" data-pptx-role="decoration" />
  
  
  <g id="header-group" data-pptx-bounds="60 42 1160 138">
    <rect x="60" y="42" width="260" height="28" rx="14" fill="#8F2D56" />
    <text x="190" y="61" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">原生缺陷剖析</text>
    <text x="60" y="106" font-size="28" font-weight="bold" fill="#0F172A">原生 Axios 在大型复杂应用下的七大致命痛点</text>
    <text x="60" y="146" font-size="16" fill="#6C757D">这些生产环境中的暗坑，你的代码中招了吗？</text>
  </g>

  
  <g id="quad-card-01" data-pptx-bounds="60 190 560 180">
    <rect x="60" y="194" width="560" height="176" rx="12" fill="#E2DDD5" />
    <rect x="60" y="190" width="560" height="176" rx="12" fill="#FFFFFF" stroke="#D81159" stroke-width="1.5" />
    <rect x="80" y="206" width="28" height="28" rx="6" fill="#D81159" />
    <text x="94" y="226" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="118" y="227" font-size="18" font-weight="bold" fill="#D81159">痛点 1：冗长多层解包</text>
    <text fill="#2B2D42" font-size="14" x="84" y="265">
      <tspan>原生响应包裹在 res.data 中，业务每处必须手写 res.data.data 且极易</tspan></text><text fill="#2B2D42" font-size="14" x="84" y="287"><tspan>引发空指针异常。</tspan>
    </text></g>
  
  <g id="quad-card-02" data-pptx-bounds="660 190 560 180">
    <rect x="660" y="194" width="560" height="176" rx="12" fill="#E2DDD5" />
    <rect x="660" y="190" width="560" height="176" rx="12" fill="#FFFFFF" stroke="#8F2D56" stroke-width="1.5" />
    <rect x="680" y="206" width="28" height="28" rx="6" fill="#8F2D56" />
    <text x="694" y="226" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="718" y="227" font-size="18" font-weight="bold" fill="#8F2D56">痛点 2：Token 刷新死锁</text>
    <text fill="#2B2D42" font-size="14" x="684" y="265">
      <tspan>401 时多个并发请求同时调用刷新接口，导致新旧 Token 竞态覆写进而鉴</tspan></text><text fill="#2B2D42" font-size="14" x="684" y="287"><tspan>权失效崩溃。</tspan>
    </text></g>
  
  <g id="quad-card-03" data-pptx-bounds="60 385 560 180">
    <rect x="60" y="389" width="560" height="176" rx="12" fill="#E2DDD5" />
    <rect x="60" y="385" width="560" height="176" rx="12" fill="#FFFFFF" stroke="#FFBC42" stroke-width="1.5" />
    <rect x="80" y="401" width="28" height="28" rx="6" fill="#FFBC42" />
    <text x="94" y="421" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03</text>
    <text x="118" y="422" font-size="18" font-weight="bold" fill="#FFBC42">痛点 3：连击并发脏数据</text>
    <text fill="#2B2D42" font-size="14" x="84" y="460">
      <tspan>用户快速狂点提交按钮，前序请求未完成且重复提交，引发后端数据重复插</tspan></text><text fill="#2B2D42" font-size="14" x="84" y="482"><tspan>入。</tspan>
    </text></g>
  
  <g id="quad-card-04" data-pptx-bounds="660 385 560 180">
    <rect x="660" y="389" width="560" height="176" rx="12" fill="#E2DDD5" />
    <rect x="660" y="385" width="560" height="176" rx="12" fill="#FFFFFF" stroke="#218380" stroke-width="1.5" />
    <rect x="680" y="401" width="28" height="28" rx="6" fill="#218380" />
    <text x="694" y="421" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04</text>
    <text x="718" y="422" font-size="18" font-weight="bold" fill="#218380">痛点 4：Blob 错误文件劫持</text>
    <text fill="#2B2D42" font-size="14" x="684" y="460">
      <tspan>responseType: blob 时若后端报错返回 JSON，会被强转为损坏的空文件</tspan></text><text fill="#2B2D42" font-size="14" x="684" y="482"><tspan>直接下载。</tspan>
    </text></g>

  
  <g id="summary-banner" data-pptx-bounds="60 580 1160 76">
    <rect x="60" y="584" width="1160" height="72" rx="14" fill="#E2DDD5" />
    <rect x="60" y="580" width="1160" height="72" rx="14" fill="#F1EFE8" stroke="#E2DDD5" stroke-width="1" />
    <text fill="#8F2D56" font-weight="bold" font-size="15" x="90" y="618">
      <tspan>【架构启示】网络层封装的本质，是对原生网络交互脆弱性的全面工程兜底。</tspan>
    </text></g>

  
  <g id="footer-group" data-pptx-bounds="60 670 1160 30" font-size="14">
    <text x="60" y="688" fill="#6C757D">Vue 3 + TS 工业级 Axios 深度封装实战 · 全栈教学课程</text>
    <text x="1220" y="688" font-weight="bold" fill="#8F2D56" text-anchor="end">03 / 30</text>
  </g>

</svg>