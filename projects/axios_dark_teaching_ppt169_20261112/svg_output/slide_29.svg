    <text x="60" y="106" font-size="28" font-weight="bold" fill="#F8FAFC">端到端强类型守卫：泛型 request&lt;T&gt;() 封装与业务契约对齐</text>
    <text x="60" y="146" font-size="16" fill="#94A3B8">函数输入参数精准校验，函数返回值直达业务实体类型</text>
  </g>

  <!-- Quadrant 1 Card -->
  <g id="quad-card-01" data-pptx-bounds="60 190 560 180">
    <rect x="60" y="194" width="560" height="176" rx="12" fill="#060911" />
    <rect x="60" y="190" width="560" height="176" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="80" y="206" width="28" height="28" rx="6" fill="#0B0F19" stroke="#38BDF8" stroke-width="1" />
