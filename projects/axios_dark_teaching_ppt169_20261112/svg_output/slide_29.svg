    <text x="118" y="227" font-size="18" font-weight="bold" fill="#38BDF8">统一泛型包装函数</text>
    <text x="84" y="265" font-size="14" fill="#CBD5E1">
      <tspan x="84" dy="0">export function request&lt;T = any&gt;(config: AxiosRequestConfig):</tspan><tspan x="84" dy="22">Promise&lt;T&gt;，返回类型直接对齐业务泛型 T。</tspan>
    </text>
  </g>
  <!-- Quadrant 2 Card -->
  <g id="quad-card-02" data-pptx-bounds="660 190 560 180">
    <rect x="660" y="194" width="560" height="176" rx="12" fill="#060911" />
    <rect x="660" y="190" width="560" height="176" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <rect x="680" y="206" width="28" height="28" rx="6" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
    <text x="694" y="226" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">02</text>
    <text x="718" y="227" font-size="18" font-weight="bold" fill="#10B981">业务接口契约定义</text>
    <text x="684" y="265" font-size="14" fill="#CBD5E1">
      <tspan x="684" dy="0">export interface UserInfo { id: number; username: string; role:</tspan><tspan x="684" dy="22">string; }，前后端定义精准强类型模型。</tspan>
    </text>
  </g>
  <!-- Quadrant 3 Card -->
  <g id="quad-card-03" data-pptx-bounds="60 385 560 180">
    <rect x="60" y="389" width="560" height="176" rx="12" fill="#060911" />
    <rect x="60" y="385" width="560" height="176" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="80" y="401" width="28" height="28" rx="6" fill="#0B0F19" stroke="#F59E0B" stroke-width="1" />
    <text x="94" y="421" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle">03</text>
    <text x="118" y="422" font-size="18" font-weight="bold" fill="#F59E0B">业务组件零断言消费</text>
    <text x="84" y="460" font-size="14" fill="#CBD5E1">
      <tspan x="84" dy="0">const user = await getUserInfoApi(); // user 自动推导为 UserInfo</tspan><tspan x="84" dy="22">类型，直接访问属性无任何类型隐患。</tspan>
    </text>
  </g>
  <!-- Quadrant 4 Card -->
  <g id="quad-card-04" data-pptx-bounds="660 385 560 180">
    <rect x="660" y="389" width="560" height="176" rx="12" fill="#060911" />
    <rect x="660" y="385" width="560" height="176" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
    <rect x="680" y="401" width="28" height="28" rx="6" fill="#0B0F19" stroke="#A855F7" stroke-width="1" />
    <text x="694" y="421" font-size="14" font-weight="bold" fill="#A855F7" text-anchor="middle">04</text>
    <text x="718" y="422" font-size="18" font-weight="bold" fill="#A855F7">编译期类型安全兜底</text>
    <text x="684" y="460" font-size="14" fill="#CBD5E1">
      <tspan x="684" dy="0">若前端访问不存在的属性（如 user.age），vue-tsc 编译期直接拦截报</tspan><tspan x="684" dy="22">警，将运行时错误扼杀在开发阶段。</tspan>
    </text>
