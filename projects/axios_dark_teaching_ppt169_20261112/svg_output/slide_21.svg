<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Microsoft YaHei', Arial">
  <rect id="bg-canvas" width="1280" height="720" fill="#0B0F19" data-pptx-role="background" />
  <path id="deco-glow-1" d="M 0,0 L 420,0 C 370,180 500,260 400,440 C 320,580 440,680 340,720 L 0,720 Z" fill="#1E293B" opacity="0.45" data-pptx-role="decoration" />
  <path id="deco-glow-2" d="M 0,0 L 220,0 C 180,200 280,320 190,500 C 130,620 220,680 180,720 L 0,720 Z" fill="#38BDF8" opacity="0.06" data-pptx-role="decoration" />
  
  <!-- Header Group -->
  <g id="header-group" data-pptx-bounds="60 42 1160 138">
    <rect x="60" y="42" width="260" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="190" y="61" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">核心要点五 · 容错重试</text>
    <text x="60" y="106" font-size="28" font-weight="bold" fill="#F8FAFC">核心要点五：网络异常分类与自动重试策略边界划分</text>
    <text x="60" y="146" font-size="16" fill="#94A3B8">明确重试的适用范围：哪些错误应当重试，哪些错误绝不能重试！</text>
  </g>

  <!-- Column 1 Card -->
  <g id="card-01" data-pptx-bounds="60 190 360 375">
    <rect x="60" y="194" width="360" height="371" rx="14" fill="#060911" />
    <rect x="60" y="190" width="360" height="371" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <rect x="80" y="210" width="32" height="32" rx="8" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
    <text x="96" y="232" font-size="16" font-weight="bold" fill="#10B981" text-anchor="middle">01</text>
    <text x="120" y="232" font-size="18" font-weight="bold" fill="#10B981">应当重试的场景 (可恢复)</text>
    <line x1="80" y1="258" x2="400" y2="258" stroke="#334155" stroke-width="1" />
    <text x="84" y="290" font-size="14" fill="#CBD5E1">
      <tspan x="84" dy="0">网络超时 (ECONNABORTED)、偶发断网</tspan><tspan x="84" dy="22">(ERR_NETWORK)、服务端瞬时 503 重启、网</tspan><tspan x="84" dy="22">关 502/504 抖动。</tspan>
    </text>
  </g>
  <!-- Column 2 Card -->
  <g id="card-02" data-pptx-bounds="460 190 360 375">
    <rect x="460" y="194" width="360" height="371" rx="14" fill="#060911" />
    <rect x="460" y="190" width="360" height="371" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
    <rect x="480" y="210" width="32" height="32" rx="8" fill="#0B0F19" stroke="#EF4444" stroke-width="1" />
    <text x="496" y="232" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">02</text>
    <text x="520" y="232" font-size="18" font-weight="bold" fill="#EF4444">绝不能重试的场景 (不可恢复)</text>
    <line x1="480" y1="258" x2="800" y2="258" stroke="#334155" stroke-width="1" />
    <text x="484" y="290" font-size="14" fill="#CBD5E1">
      <tspan x="484" dy="0">400 参数格式错误、401 凭证过期、403 权限拒</tspan><tspan x="484" dy="22">绝、404 资源不存在、业务逻辑报错 (如余额不</tspan><tspan x="484" dy="22">足)。</tspan>
    </text>
  </g>
  <!-- Column 3 Card -->
  <g id="card-03" data-pptx-bounds="860 190 360 375">
    <rect x="860" y="194" width="360" height="371" rx="14" fill="#060911" />
    <rect x="860" y="190" width="360" height="371" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="880" y="210" width="32" height="32" rx="8" fill="#0B0F19" stroke="#F59E0B" stroke-width="1" />
    <text x="896" y="232" font-size="16" font-weight="bold" fill="#F59E0B" text-anchor="middle">03</text>
    <text x="920" y="232" font-size="18" font-weight="bold" fill="#F59E0B">非幂等操作的谨慎重试</text>
    <line x1="880" y1="258" x2="1200" y2="258" stroke="#334155" stroke-width="1" />
    <text x="884" y="290" font-size="14" fill="#CBD5E1">
      <tspan x="884" dy="0">POST 创建订单、资金划扣等操作若重试可能导</tspan><tspan x="884" dy="22">致重复创建，需配合服务端业务唯一</tspan><tspan x="884" dy="22">Request-Id 防重保证幂等性。</tspan>
    </text>
  </g>

  <!-- Summary Banner -->
  <g id="summary-banner" data-pptx-bounds="60 580 1160 76">
    <rect x="60" y="584" width="1160" height="72" rx="14" fill="#060911" />
    <rect x="60" y="580" width="1160" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="60" y="580" width="6" height="72" rx="3" fill="#38BDF8" />
    <text x="95" y="618" font-size="14" font-weight="bold" fill="#38BDF8">
      <tspan x="95" dy="0">💡 架构核心解析：【重试铁律】只有不可抗力的瞬时网络链路波动才允许重试，逻辑错误重试只会加剧服务端负担。</tspan>
    </text>
  </g>

  <!-- Footer Group -->
  <g id="footer-group" data-pptx-bounds="60 670 1160 30" font-size="14">
    <text x="60" y="688" fill="#94A3B8">Vue 3 + TS 工业级 Axios 深度封装与后端联动实战 · 全栈教学课程</text>
    <text x="1220" y="688" font-weight="bold" fill="#38BDF8" text-anchor="end">21 / 30</text>
  </g>

</svg>
