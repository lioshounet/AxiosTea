    <text x="640" y="213" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle">TypeScript 工业级网络切面源码精读 · IDE 控制台视图</text>
    <text x="85" y="260" font-size="14" font-family="'Microsoft YaHei', Consolas, monospace">
      <tspan x="85" dy="0"><tspan fill="#475569"> 1  </tspan><tspan fill="#64748B">// client/src/utils/retry.ts</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 2  </tspan><tspan fill="#E2E8F0">export function handleResponseRetry(error: any, instance: AxiosInstance): Promise&lt;any&gt; {</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 3  </tspan><tspan fill="#E2E8F0">  const config = error.config;</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 4  </tspan><tspan fill="#E2E8F0">  if (!config || !config.retry || config.retry &lt;= 0) return Promise.reject(error);</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 5  </tspan><tspan fill="#E2E8F0">  </tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 6  </tspan><tspan fill="#64748B">  // 维护重试计数器元数据</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 7  </tspan><tspan fill="#E2E8F0">  config.__retryCount = config.__retryCount || 0;</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 8  </tspan><tspan fill="#E2E8F0">  if (config.__retryCount &gt;= config.retry) return Promise.reject(error);</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569"> 9  </tspan><tspan fill="#E2E8F0">  </tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">10  </tspan><tspan fill="#E2E8F0">  config.__retryCount += 1;</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">11  </tspan><tspan fill="#64748B">  // 计算指数退避延迟时间：retryDelay * 2^(count - 1)</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">12  </tspan><tspan fill="#E2E8F0">  const backoffDelay = (config.retryDelay || 1000) * Math.pow(2, config.__retryCount - 1);</tspan></tspan><tspan x="85" dy="24"><tspan fill="#475569">13  </tspan><tspan fill="#E2E8F0">  </tspan></tspan>
    </text>
