    <text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="260">
      <tspan><tspan fill="#475569"> 1  </tspan><tspan fill="#64748B">// 响应拦截器 401 错误切入处理</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="284"><tspan><tspan fill="#475569"> 2  </tspan><tspan fill="#E2E8F0">if (error.response?.status === 401) {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="308"><tspan><tspan fill="#475569"> 3  </tspan><tspan fill="#E2E8F0">  const originalConfig = error.config;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="332"><tspan><tspan fill="#475569"> 4  </tspan><tspan fill="#E2E8F0">  if (!isRefreshing) {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="356"><tspan><tspan fill="#475569"> 5  </tspan><tspan fill="#E2E8F0">    isRefreshing = true;</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="380"><tspan><tspan fill="#475569"> 6  </tspan><tspan fill="#E2E8F0">    return handleTokenRefresh().then((newToken) =&gt; {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="404"><tspan><tspan fill="#475569"> 7  </tspan><tspan fill="#E2E8F0">      retryQueue.forEach((cb) =&gt; cb(newToken));</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="428"><tspan><tspan fill="#475569"> 8  </tspan><tspan fill="#E2E8F0">      retryQueue = [];</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="452"><tspan><tspan fill="#475569"> 9  </tspan><tspan fill="#E2E8F0">      originalConfig.headers.set('Authorization', `Bearer ${newToken}`);</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="476"><tspan><tspan fill="#475569">10  </tspan><tspan fill="#E2E8F0">      return service(originalConfig); // 重放主请求</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="500"><tspan><tspan fill="#475569">11  </tspan><tspan fill="#E2E8F0">    }).finally(() =&gt; { isRefreshing = false; });</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="524"><tspan><tspan fill="#475569">12  </tspan><tspan fill="#E2E8F0">  } else {</tspan></tspan></text><text font-family="'Microsoft YaHei', Consolas, monospace" font-size="14" x="85" y="548"><tspan><tspan fill="#475569">13  </tspan><tspan fill="#64748B">    // 互斥锁已被占用，返回未决 Promise 将自身挂起进入队列</tspan></tspan>
